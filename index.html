<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Grönt spel</title>
</head>
<body>
    <div id="game">
        <h1>GISSA NUMRET</h1>
        <p>Gissa ett nummer mellan 1 och 100.</p>
        <input type="number" min=1 max=100 id="guessInput" placeholder="Skriv din gissning här"    >
        <button id="guessButton">Gissa</button>
        <p id="result"></p>
        <p id="attempts"></p>
        <button id="resetButton">Starta om</button>
    </div>
</body>
</html>
